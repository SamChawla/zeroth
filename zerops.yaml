# Zeroth itself. Three setups, one repository.
zerops:
  # Per Zerops' own Python build-pipeline docs: build and run are separate
  # containers. deployFiles lands in /var/www at runtime, which is NOT
  # where run.prepareCommands executes - prepareCommands needs its own
  # copy of requirements.txt, bridged across via addToRunPrepare. Build-
  # time pip installs do not carry over; prepareCommands reinstalls with
  # --ignore-installed, matching the documented pattern exactly.
  - setup: api
    build:
      base: python@3.12
      os: ubuntu
      buildCommands:
        - pip install -r requirements.txt
      deployFiles: ./
      addToRunPrepare:
        - requirements.txt
    run:
      base: python@3.12
      os: ubuntu
      ports:
        - port: 8000
          httpSupport: true
      prepareCommands:
        - python3 -m pip install --ignore-installed -r requirements.txt
      start: uvicorn zeroth.api.main:app --host 0.0.0.0 --port 8000

  - setup: worker
    build:
      base: python@3.12
      os: ubuntu
      buildCommands:
        - pip install -r requirements.txt
      deployFiles: ./
      addToRunPrepare:
        - requirements.txt
    run:
      base: python@3.12
      os: ubuntu
      # apt-get needs root; prepareCommands run as a non-root user and it
      # fails with Permission denied on /var/lib/apt/lists/partial
      # regardless of OS. Dropping git for now - ingest.clone() only needs
      # it once a real job runs, not at startup; revisit if that's a real
      # base-image gap once the worker is actually up.
      prepareCommands:
        - python3 -m pip install --ignore-installed -r requirements.txt
      start: python -m zeroth.worker.main

  # "static" as a Zerops run base is under-documented and 502'd with zero
  # logs across several tries (port, deployFiles syntax) - sidestepping it
  # with the same python@3.12 + http.server pattern already confirmed by
  # local dev (see README), rather than guess further against undocumented
  # platform internals.
  - setup: web
    build:
      base: python@3.12
      os: alpine
      # The browser cannot reach the API by relative path: web is a static file
      # server on its own origin. The base URL is baked in here rather than
      # hardcoded in the pages, so the checked-in config.js keeps its localhost
      # default for local development. api's CORS already allows this origin.
      envVariables:
        ZEROTH_API_URL: ${api_zeropsSubdomain}
      buildCommands:
        - printf 'window.ZEROTH_API = "%s";\n' "$ZEROTH_API_URL" > web/config.js
      deployFiles: ./
    run:
      base: python@3.12
      ports:
        - port: 8080
          httpSupport: true
      start: python -m http.server 8080 -d web
