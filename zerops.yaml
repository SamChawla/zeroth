# Zeroth itself. Three setups, one repository.
zerops:
  - setup: api
    build:
      base: python@3.12
      os: alpine
      buildCommands:
        - pip install uv
        - uv pip install --system -r requirements.txt
      deployFiles: ./
      cache:
        - ~/.cache/uv
    run:
      base: python@3.12
      ports:
        - port: 8000
          httpSupport: true
      prepareCommands:
        - pip install uv
        - uv pip install --system -r requirements.txt
      start: uvicorn zeroth.api.main:app --host 0.0.0.0 --port 8000

  - setup: worker
    build:
      base: python@3.12
      os: alpine
      buildCommands:
        - pip install uv
        - uv pip install --system -r requirements.txt
      deployFiles: ./
      cache:
        - ~/.cache/uv
    run:
      base: python@3.12
      prepareCommands:
        - apt-get update && apt-get install -y git
        - pip install uv
        - uv pip install --system -r requirements.txt
      start: python -m zeroth.worker.main

  - setup: web
    build:
      base: nodejs@latest
      os: alpine
      deployFiles: ./web
    run:
      base: static
      ports:
        - port: 8080
          httpSupport: true
