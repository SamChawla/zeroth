# Zeroth itself. Three setups, one repository.
zerops:
  - setup: api
    build:
      base: python@3.12
      os: alpine
      buildCommands:
        - pip install uv
        - uv pip install --system -r requirements.txt
      deployFiles: ./
    run:
      base: python@3.12
      ports:
        - port: 8000
          httpSupport: true
      prepareCommands:
        - pip install uv
        - uv pip install --system -r requirements.txt
      start: uvicorn zeroth.api.main:app --host 0.0.0.0 --port 8000

  - setup: worker
    build:
      base: python@3.12
      os: alpine
      buildCommands:
        - pip install uv
        - uv pip install --system -r requirements.txt
      deployFiles: ./
    run:
      base: python@3.12
      prepareCommands:
        - apt-get update && apt-get install -y git
        - pip install uv
        - uv pip install --system -r requirements.txt
      start: python -m zeroth.worker.main

  # "static" as a Zerops run base is under-documented and 502'd with zero
  # logs across several tries (port, deployFiles syntax) - sidestepping it
  # with the same python@3.12 + http.server pattern already confirmed by
  # local dev (see README), rather than guess further against undocumented
  # platform internals.
  - setup: web
    build:
      base: python@3.12
      os: alpine
      deployFiles: ./
    run:
      base: python@3.12
      ports:
        - port: 8080
          httpSupport: true
      start: python -m http.server 8080 -d web
